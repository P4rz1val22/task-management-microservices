services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: task-mgmt-postgres
    environment:
      POSTGRES_DB: taskmanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices

  # Monolith Service
  monolith:
    build:
      context: ./monolith
      dockerfile: Dockerfile
    container_name: task-mgmt-monolith
    environment:
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/taskmanagement?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - GIN_MODE=release
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: task-mgmt-auth
    environment:
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/taskmanagement?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - GIN_MODE=release
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices

  # Project Service
  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    container_name: task-mgmt-projects
    environment:
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/taskmanagement?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - GIN_MODE=release
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices

  # Task Service
  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task-mgmt-tasks
    environment:
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/taskmanagement?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - GIN_MODE=release
      # Containers use the INTERNAL listener; localhost:9092 is host-only.
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=task-events
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        # service_started, deliberately NOT service_healthy. Waiting for a
        # healthy broker would rebuild at boot exactly the coupling this design
        # exists to remove, and would push the gateway's startup out behind
        # Kafka's as well. The writer connects lazily on first publish, so the
        # service does not need the broker to come up. The cost is that a create
        # landing in the cold-boot window loses its event -- the same gap a
        # transactional outbox would close.
        condition: service_started
    restart: unless-stopped
    networks:
      - microservices

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: task-mgmt-gateway
    environment:
      - MONOLITH_URL=http://monolith:8080
      - AUTH_SERVICE_URL=http://auth-service:8082
      - PROJECT_SERVICE_URL=http://project-service:8083
      - TASK_SERVICE_URL=http://task-service:8084
      - GIN_MODE=release
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      monolith:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices

  # Kafka broker (KRaft mode - no Zookeeper)
  kafka:
    image: apache/kafka:3.9.0
    container_name: task-mgmt-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners on purpose: INTERNAL for containers on the
      # microservices network, EXTERNAL so tools and integration tests running
      # on the host can reach the broker at localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Auto-created topics must get 3 partitions, not the default 1. Ordering
      # per task depends on the partition key doing something, and with a single
      # partition it trivially cannot -- the design would look correct while
      # proving nothing.
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - microservices

volumes:
  postgres_data:
    driver: local

networks:
  microservices:
    driver: bridge